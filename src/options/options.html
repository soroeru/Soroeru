<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>formfill-assistant Options</title>
    <link rel="stylesheet" href="./options.css" />
  </head>
  <body>
    <main class="ffa-options">
      <header>
        <h1>Profile fields</h1>
        <p>Data is stored locally in this browser. Password and credit card fields are not supported.</p>
      </header>

      <section class="ffa-panel" aria-labelledby="field-form-heading">
        <h2 id="field-form-heading">Add or edit field</h2>
        <form id="profile-field-form">
          <input type="hidden" id="field-id" />

          <label>
            Type
            <select id="field-kind" required>
              <option value="fullName">Full name</option>
              <option value="email">Email address</option>
              <option value="phone">Phone number</option>
              <option value="postalCode">Postal code</option>
              <option value="address">Address</option>
              <option value="companyName">Company name</option>
              <option value="departmentName">Department name</option>
              <option value="custom">Custom field</option>
            </select>
          </label>

          <label>
            Label
            <input id="field-label" type="text" required autocomplete="off" placeholder="Fake department" />
          </label>

          <label>
            Value
            <textarea id="field-value" required rows="3" placeholder="Example value"></textarea>
          </label>

          <label>
            Match terms
            <input id="field-match-terms" type="text" autocomplete="off" placeholder="term, synonym, Japanese label" />
          </label>

          <label>
            Order
            <input id="field-order" type="number" min="0" step="1" value="0" required />
          </label>

          <div class="ffa-actions">
            <button type="submit">Save field</button>
            <button type="button" id="reset-form">New field</button>
            <button type="button" id="add-fake-data">Add fake data</button>
          </div>
        </form>
        <p id="status-message" role="status"></p>
      </section>

      <section class="ffa-panel" aria-labelledby="stored-fields-heading">
        <div class="ffa-section-header">
          <h2 id="stored-fields-heading">Stored fields</h2>
          <button type="button" id="clear-fields">Clear all</button>
        </div>
        <div id="field-list" class="ffa-field-list"></div>
      </section>
    </main>

    <script type="module" src="./options.js"></script>
  </body>
</html>
