<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <title>PoC fixture: 住所フォーム（R3）</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 24px; max-width: 720px; }
    .field { margin: 10px 0; }
    .field label { display: inline-block; width: 11em; }
    .field input { width: 22em; padding: 4px; }
    .note { background: #fff7d6; padding: 8px 12px; border-left: 4px solid #e0a800; }
  </style>
</head>
<body>
  <h1>お届け先の入力（PoC fixture）</h1>
  <p class="note">
    検証にはダミーデータのみ使用してください。右下のオーバーレイ（PoC 拡張の content script）に
    観測ログが出ます。値は記録されません。
  </p>
  <form action="address-form.html" method="GET">
    <div class="field"><label for="x-name">氏名</label>
      <input id="x-name" name="name" autocomplete="name" /></div>
    <div class="field"><label for="x-email">メールアドレス</label>
      <input id="x-email" name="email" type="email" autocomplete="email" /></div>
    <div class="field"><label for="x-tel">電話番号</label>
      <input id="x-tel" name="tel" type="tel" autocomplete="tel" /></div>
    <div class="field"><label for="x-postal">郵便番号</label>
      <input id="x-postal" name="postal-code" autocomplete="postal-code" /></div>
    <div class="field"><label for="x-level1">都道府県</label>
      <input id="x-level1" name="address-level1" autocomplete="address-level1" /></div>
    <div class="field"><label for="x-level2">市区町村</label>
      <input id="x-level2" name="address-level2" autocomplete="address-level2" /></div>
    <div class="field"><label for="x-line1">番地・建物</label>
      <input id="x-line1" name="address-line1" autocomplete="address-line1" /></div>
    <div class="field"><label for="x-org">会社名</label>
      <input id="x-org" name="organization" autocomplete="organization" /></div>
    <button type="submit">送信（ユーザー操作）</button>
  </form>
</body>
</html>
