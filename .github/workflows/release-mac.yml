name: release-mac

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Playwright Chromium for release gate
        run: npx playwright install chromium

      - name: Run release gate (typecheck, unit tests, static checks)
        run: npm run release:check

      - name: Build unsigned Soroeru DMG
        run: npm run package:dmg

      - name: Create GitHub release if it does not exist
        run: |
          gh release view "${{ github.ref_name }}" 2>/dev/null || \
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            --prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Mac DMG to release
        run: |
          gh release upload "${{ github.ref_name }}" \
            release/Soroeru-*.dmg \
            --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
