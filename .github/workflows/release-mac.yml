name: release-mac

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: npm

      - run: npm ci

      - name: Install Playwright Chromium (macOS)
        run: npx playwright install chromium

      - name: Run release gate (typecheck, unit tests, static checks)
        run: npm run release:check

      - name: Build and package Mac app
        run: npm run package:mac

      - name: Create GitHub release if it does not exist
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            --prerelease \
            || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Mac app ZIP to release
        run: |
          gh release upload "${{ github.ref_name }}" \
            release/Catashiro-mac-beta.zip \
            --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
