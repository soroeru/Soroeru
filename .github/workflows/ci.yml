name: ci

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # SEC-003 dependency audit gate. Scoped to production dependencies
      # (runtime + optional) at --audit-level=high so it guards the shipped
      # attack surface and fails on NEW high/critical advisories there, while
      # not turning red on accepted build-time-only devDependency advisories
      # (tracked in docs/security.md §12.0). See docs/dependency-security.md.
      - name: SEC-003 production dependency audit gate
        run: npm run audit:check

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm test
      - name: PRIV-001 network egress allowlist
        run: npm run poc -- check-egress
      - name: PRIV-002 local persistence allowlist
        run: npm run poc -- check-persistence
      - name: SEC-002 CAPTCHA / anti-bot dependency denylist
        run: npm run poc -- check-bypass

  e2e-deterministic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Deterministic-mapper matrix against local test sites (chromium)
        run: npm run poc:matrix -- deterministic chromium
