name: project-issue-defaults

on:
  issues:
    types: [opened]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      issue_number:
        description: Repository issue number to (re)apply Project defaults
        required: false
        type: string
      reconcile_project:
        description: Reconcile manually added Project items
        required: false
        default: false
        type: boolean

# Project writes use a short-lived GitHub App installation token, not GITHUB_TOKEN.
permissions:
  contents: read

concurrency:
  group: project-issue-defaults
  cancel-in-progress: false

jobs:
  configure-project:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Scope the token to the org installation (all repos the App can access —
      # currently only Soroeru). Do not pass `repositories` + narrow permission-*
      # overrides: that combination can produce a repo-scoped token that fails
      # organization Projects V2 GraphQL with FORBIDDEN / opaque errors.
      - name: Create GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.SOROERU_PROJECT_APP_ID }}
          private-key: ${{ secrets.SOROERU_PROJECT_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Add issue to Project and apply defaults
        env:
          GH_PROJECT_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: node scripts/project-issue-defaults.mjs --event "$GITHUB_EVENT_PATH"
