<!doctype html>
<html lang="ja"><meta charset="utf-8"><title>架空プロフィール</title>
<body><h1>プロフィール</h1><form>
<label>メールアドレス<input id="email" type="email" autocomplete="email" value="fake@example.com"></label>
<label>電話番号<input id="phone" type="tel" autocomplete="tel" value="090-0000-0000"></label>
<label>氏名<input id="name" type="text" autocomplete="name" value="架空花子"></label>
<label>パスワード<input id="password" type="password" autocomplete="current-password" value="fake-secret-password"></label>
<label>セキュリティコード<input id="cvv" autocomplete="cc-csc" value="987"></label>
<label>ワンタイムコード<input id="otp" autocomplete="one-time-code" value="123456"></label>
</form></body></html>
